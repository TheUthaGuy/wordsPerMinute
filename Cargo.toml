[package]
name = "wpm-counter"
version = "0.1.0"
edition = "2021"
description = "System-wide words-per-minute counter with overlay and dashboard"

[dependencies]
eframe = "0.29"
egui_plot = "0.29"
egui_extras = "0.29"
tray-icon = "0.19"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
